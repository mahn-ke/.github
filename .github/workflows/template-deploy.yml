# Required environment variables:
# - NGINX_HOME: Directory containing nginx.exe (https://nginx.org/)
# - ACME_HOME:  Directory containing wacs.exe (https://www.win-acme.com/)
# - CERT_HOME:  Directory containing certificates generated by ACME
#
# Required binaries/tools:
# - docker
# - docker compose

name: Deploy service, generate certificates, and update NGINX configuration

on:
  workflow_call:
    inputs:
      infrastructure_review:
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check for Dockerfile
        id: check_dockerfile
        run: |
          if [ -f app/Dockerfile ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Dockerfile found in app directory."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "No Dockerfile found in app directory."
          fi

      - name: Log in to GitHub Container Registry
        if: steps.check_dockerfile.outputs.exists == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and run Docker test stage
        if: inputs.infrastructure_review && steps.check_dockerfile.outputs.exists == 'true'
        run: docker build --target test .
        working-directory: app

      - name: Build Docker image
        if: steps.check_dockerfile.outputs.exists == 'true'
        run: |
          docker build -t ghcr.io/${{ github.repository }}:latest .
        working-directory: app

      - name: Push Docker image
        if: steps.check_dockerfile.outputs.exists == 'true' && github.event_name != 'pull_request'
        run: |
          docker push ghcr.io/${{ github.repository }}:latest
        working-directory: app

  prepare-postgres:
    runs-on: ubuntu-latest
    outputs:
      DATABASE_NAME: ${{ steps.ensure-db.outputs.DATABASE_NAME }}
      PROJECT_NAME: ${{ steps.ensure-db.outputs.PROJECT_NAME }}
    steps: 
      - name: Ensure database exists
        id: ensure-db
        env:
           PGHOST: ${{ secrets.PGHOST }}
           PGPORT: ${{ secrets.PGPORT }}
           PGUSER: ${{ secrets.PGUSER }}
           PGPASSWORD: ${{ secrets.PGPASSWORD }}
           PGDATABASE: "postgres"
           REVIEW_POLICY: ${{ inputs.infrastructure_review }}
        run: |
          if [ "$REVIEW_POLICY" = "true" ]; then
            : "${PGHOST:?Missing PostgreSQL host; dependency PRs need Actions credentials}"
            : "${PGUSER:?Missing PostgreSQL user}"
            : "${PGPASSWORD:?Missing PostgreSQL password}"
          fi
          REPO_NAME="$(basename "$GITHUB_REPOSITORY")"
          DATABASE_NAME="$(echo "$REPO_NAME" | sed 's/-by-vincent//' | tr '-' '.')"
          echo "DATABASE_NAME=$DATABASE_NAME" >> $GITHUB_OUTPUT
          PROJECT_NAME="$(echo "$REPO_NAME" | sed 's/-by-vincent//')"
          echo "PROJECT_NAME=$PROJECT_NAME" >> $GITHUB_OUTPUT

          for suffix in infrastructure service; do
            db="${DATABASE_NAME}-$suffix"
            exists="$(psql -tAc "SELECT 1 FROM pg_database WHERE datname = '$db'")"
            if [ "$exists" = "1" ]; then
              echo "Database '$db' already exists."
              continue
            fi
            if [ "$REVIEW_POLICY" = "true" ] && [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              echo "Missing state database; PR validation must not create infrastructure."
              exit 1
            fi
            createdb "$db"
            echo "Database '$db' created."
          done

  infrastructure-terraform-plan:
    concurrency:
      group: ${{ github.repository }}-infrastructure-state
      cancel-in-progress: false
    needs: prepare-postgres
    runs-on: ubuntu-latest
    env:
      PGDATABASE: ${{ needs.prepare-postgres.outputs.DATABASE_NAME }}-infrastructure
    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}
      HAS_DOCKER_COMPOSE: ${{ steps.check-docker-compose.outputs.HAS_DOCKER_COMPOSE }}
    steps:
      - name: Expose GitHub environment as shell variables
        env:
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
        run: |
          # https://docs.github.com/en/actions/using-workflows/workflow-commands-for-github-actions#setting-an-environment-variable
          # https://docs.github.com/en/actions/using-workflows/workflow-commands-for-github-actions#multiline-strings
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          to_envs() { jq -r "to_entries[] | \"\(.key)<<$EOF\n\(.value)\n$EOF\n\""; }
          echo "$SECRETS_CONTEXT" | to_envs >> $GITHUB_ENV
          
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - run: terraform version

      - name: Prepare protected generated configuration branch
        if: github.repository == 'mahn-ke/repos' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && hashFiles('tools/generated-config-delivery.mjs') != ''
        run: node tools/generated-config-delivery.mjs prepare
        env:
          GH_TOKEN: ${{ secrets.TF_VAR_GITHUB_PAT }}

      - run: terraform init -upgrade
        working-directory: infrastructure

      - name: Check protected generated-file state adoption
        if: github.repository == 'mahn-ke/repos' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && hashFiles('tools/generated-config-delivery.mjs') != ''
        run: node tools/generated-config-delivery.mjs assert-state

      - name: exit if terraform fmt is not clean
        run: |
          if ! terraform fmt -check -recursive; then
            echo "Terraform files are not formatted correctly. Please run 'terraform fmt' to fix them."
            exit 1
          fi
        working-directory: infrastructure


      - name: terraform plan
        id: plan
        continue-on-error: true
        run: | 
          set +e
          terraform plan -input=false -lock-timeout=5m --out=tfplan --detailed-exitcode
          plan_exit=$?
          echo "exitcode=$plan_exit" >> "$GITHUB_OUTPUT"
          exit "$plan_exit"
        working-directory: infrastructure

      - name: Check if Terraform apply is required
        env:
          PLAN_EXIT: ${{ steps.plan.outputs.exitcode }}
        run: |
          case "$PLAN_EXIT" in
            0) echo "No changes" ;;
            2) echo "Changes detected" ;;
            *) echo "Terraform plan failed or returned no exit code"; exit 1 ;;
          esac
        working-directory: infrastructure

      - name: No Terraform changes
        if: steps.plan.outputs.exitcode == '0'
        run: echo No changes

      - name: Publish unchanged staged configuration PR
        if: github.repository == 'mahn-ke/repos' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.plan.outputs.exitcode == '0' && hashFiles('tools/generated-config-delivery.mjs') != ''
        run: node tools/generated-config-delivery.mjs publish
        env:
          GH_TOKEN: ${{ secrets.TF_VAR_GITHUB_PAT }}

      - name: Terraform changes detected
        if: steps.plan.outputs.exitcode == '2'
        run: echo Changed plan requires production approval

      - name: Checkout trusted plan reporting tools
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/checkout@v6
        with:
          repository: mahn-ke/.github
          ref: main
          path: policy-tools
          persist-credentials: false

      - name: Render infrastructure plan image
        if: steps.plan.outputs.exitcode == '2'
        env:
          PLAN_EXIT: ${{ steps.plan.outputs.exitcode }}
          PLAN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PLAN_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/infrastructure-plan.json"' EXIT
          terraform show -json tfplan > "$RUNNER_TEMP/infrastructure-plan.json"
          node ../policy-tools/tools/plan-image.mjs "$RUNNER_TEMP/infrastructure-plan.json" ../plan-images-infrastructure infrastructure "$PLAN_EXIT"
        working-directory: infrastructure

      - name: Upload infrastructure plan image
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/upload-artifact@v7
        with:
          name: terraform-plan-image-infrastructure
          path: |
            plan-images-infrastructure/infrastructure.png
            plan-images-infrastructure/report.json
          overwrite: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload Terraform plan
        if: steps.plan.outputs.exitcode == 2 && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-infrastructure
          path: infrastructure/tfplan

      - name: Check for docker-compose.yml
        id: check-docker-compose
        run: |
          if [ ! -f "docker-compose.yml" ]; then
            echo "HAS_DOCKER_COMPOSE=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "HAS_DOCKER_COMPOSE=true" >> $GITHUB_OUTPUT

  infrastructure-terraform-apply:
    concurrency:
      group: ${{ github.repository }}-infrastructure-state
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      PGDATABASE: ${{ needs.prepare-postgres.outputs.DATABASE_NAME }}-infrastructure
    environment: production
    needs: [build, prepare-postgres, infrastructure-terraform-plan]
    if: needs.infrastructure-terraform-plan.outputs.exitcode == 2 && github.event_name != 'pull_request'
    steps:
      - name: Expose GitHub environment as shell variables
        env:
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
        run: |
          # https://docs.github.com/en/actions/using-workflows/workflow-commands-for-github-actions#setting-an-environment-variable
          # https://docs.github.com/en/actions/using-workflows/workflow-commands-for-github-actions#multiline-strings
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          to_envs() { jq -r "to_entries[] | \"\(.key)<<$EOF\n\(.value)\n$EOF\n\""; }
          echo "$SECRETS_CONTEXT" | to_envs >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - run: terraform version
          
      - run: terraform init -upgrade
        working-directory: infrastructure

      - name: Download Terraform plan
        uses: actions/download-artifact@v8
        with:
          name: tfplan-infrastructure
          path: infrastructure

      - run: terraform apply -input=false -auto-approve tfplan
        working-directory: infrastructure

      - name: Publish protected generated configuration PR
        if: github.repository == 'mahn-ke/repos' && github.ref == 'refs/heads/main' && hashFiles('tools/generated-config-delivery.mjs') != ''
        run: node tools/generated-config-delivery.mjs publish
        env:
          GH_TOKEN: ${{ secrets.TF_VAR_GITHUB_PAT }}

  deploy:
    runs-on: hetzner2
    if: ${{ !cancelled() && needs.infrastructure-terraform-plan.outputs.HAS_DOCKER_COMPOSE == 'true' && github.event_name != 'pull_request' }}
    needs: [build, prepare-postgres, infrastructure-terraform-plan, infrastructure-terraform-apply]
    steps:
      - name: fail if any previous step failed
        if: needs.build.result != 'success' || needs.prepare-postgres.result != 'success' || needs.infrastructure-terraform-plan.result != 'success' || needs.infrastructure-terraform-apply.result == 'failure'
        run: exit 1

      - name: Expose GitHub environment as shell variables
        env:
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
        run: |
          # https://docs.github.com/en/actions/using-workflows/workflow-commands-for-github-actions#setting-an-environment-variable
          # https://docs.github.com/en/actions/using-workflows/workflow-commands-for-github-actions#multiline-strings
          $EOF = [System.Guid]::NewGuid().ToString("N").Substring(0,16)
          $secrets = $env:SECRETS_CONTEXT | ConvertFrom-Json
          foreach ($pair in $secrets.PSObject.Properties) {
            Add-Content -Path $env:GITHUB_ENV -Value "$($pair.Name)<<$EOF`n$($pair.Value)`n$EOF"
          }

      - name: Checkout current repository to src (with submodules)
        uses: actions/checkout@v6
        with:
          path: src
          submodules: recursive

      - name: Checkout mahn-ke/.github to workflow
        uses: actions/checkout@v6
        with:
          repository: mahn-ke/.github
          path: workflow 
      
      - name: Check versions
        run: | 
          docker version
          docker compose version
          nginx -v
        working-directory: src

      - name: Run Docker Compose
        env:
          COMPOSE_PROJECT_NAME: ${{ needs.prepare-postgres.outputs.PROJECT_NAME }}
        run: docker compose up -d --wait --pull always
        working-directory: src

      - name: Attempt subdomain deployment, if required
        run: ../workflow/tools/Deploy.ps1
        shell: pwsh
        working-directory: src

  service-terraform-plan:
    needs: [prepare-postgres, deploy]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    env:
      PGDATABASE: ${{ needs.prepare-postgres.outputs.DATABASE_NAME }}-service
    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - name: fail if any previous step failed
        if: needs.prepare-postgres.result == 'failure' || needs.deploy.result == 'failure'
        run: exit 1

      - name: Expose GitHub environment as shell variables
        env:
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
        run: |
          # https://docs.github.com/en/actions/using-workflows/workflow-commands-for-github-actions#setting-an-environment-variable
          # https://docs.github.com/en/actions/using-workflows/workflow-commands-for-github-actions#multiline-strings
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          to_envs() { jq -r "to_entries[] | \"\(.key)<<$EOF\n\(.value)\n$EOF\n\""; }
          echo "$SECRETS_CONTEXT" | to_envs >> $GITHUB_ENV
          
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - run: terraform version

      - run: terraform init -upgrade
        working-directory: service

      - name: exit if terraform fmt is not clean
        run: |
          if ! terraform fmt -check -recursive; then
            echo "Terraform files are not formatted correctly. Please run 'terraform fmt' to fix them."
            exit 1
          fi
        working-directory: service

      - name: terraform plan
        id: plan
        continue-on-error: true
        run: | 
          set +e
          terraform plan -input=false -lock-timeout=5m --out=tfplan --detailed-exitcode
          plan_exit=$?
          echo "exitcode=$plan_exit" >> "$GITHUB_OUTPUT"
          exit "$plan_exit"
        working-directory: service

      - name: Check if Terraform apply is required
        env:
          PLAN_EXIT: ${{ steps.plan.outputs.exitcode }}
        run: |
          case "$PLAN_EXIT" in
            0) echo "No changes" ;;
            2) echo "Changes detected" ;;
            *) echo "Terraform plan failed or returned no exit code"; exit 1 ;;
          esac
        working-directory: service

      - name: No Terraform changes
        if: steps.plan.outputs.exitcode == '0'
        run: echo No changes

      - name: Terraform changes detected
        if: steps.plan.outputs.exitcode == '2'
        run: echo Changed plan requires production approval

      - name: Checkout trusted plan reporting tools
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/checkout@v6
        with:
          repository: mahn-ke/.github
          ref: main
          path: policy-tools
          persist-credentials: false

      - name: Render service plan image
        if: steps.plan.outputs.exitcode == '2'
        env:
          PLAN_EXIT: ${{ steps.plan.outputs.exitcode }}
          PLAN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PLAN_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/service-plan.json"' EXIT
          terraform show -json tfplan > "$RUNNER_TEMP/service-plan.json"
          node ../policy-tools/tools/plan-image.mjs "$RUNNER_TEMP/service-plan.json" ../plan-images-service service "$PLAN_EXIT"
        working-directory: service

      - name: Upload service plan image
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/upload-artifact@v7
        with:
          name: terraform-plan-image-service
          path: |
            plan-images-service/service.png
            plan-images-service/report.json
          overwrite: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload Terraform plan
        if: steps.plan.outputs.exitcode == 2 && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-service
          path: service/tfplan

  service-terraform-apply:
    runs-on: ubuntu-latest
    env:
      PGDATABASE: ${{ needs.prepare-postgres.outputs.DATABASE_NAME }}-service
    environment: production
    needs: [prepare-postgres, service-terraform-plan, deploy]
    if: needs.service-terraform-plan.outputs.exitcode == 2 && github.event_name != 'pull_request'
    steps:
      - name: Expose GitHub environment as shell variables
        env:
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
        run: |
          # https://docs.github.com/en/actions/using-workflows/workflow-commands-for-github-actions#setting-an-environment-variable
          # https://docs.github.com/en/actions/using-workflows/workflow-commands-for-github-actions#multiline-strings
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          to_envs() { jq -r "to_entries[] | \"\(.key)<<$EOF\n\(.value)\n$EOF\n\""; }
          echo "$SECRETS_CONTEXT" | to_envs >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - run: terraform version
          
      - run: terraform init -upgrade
        working-directory: service

      - name: Download Terraform plan
        uses: actions/download-artifact@v8
        with:
          name: tfplan-service
          path: service

      - run: terraform apply -input=false -auto-approve tfplan
        working-directory: service
