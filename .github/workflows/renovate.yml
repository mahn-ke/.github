name: Dependency updates

on:
  workflow_dispatch:
    inputs:
      repositories:
        description: Repository autodiscovery filter
        default: mahn-ke/*
        required: true
        type: string
      dry_run:
        description: Preview updates without creating pull requests
        default: true
        type: boolean
  schedule:
    - cron: '27 4 * * *' # Run at 4:27 AM (even numbers = higher load = higher chance of GitHub dropping it)

concurrency:
  group: renovate-${{ github.ref }}
  cancel-in-progress: true
    
jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.1.14
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          docker-cmd-file: .github/renovate-entrypoint.sh
          docker-user: root
          env-regex: '^(?:RENOVATE_\w+|TERRAFORM_VERSION)$'
        env:
          TERRAFORM_VERSION: '1.16.5'
          RENOVATE_AUTODISCOVER: true
          RENOVATE_AUTODISCOVER_FILTER: ${{ inputs.repositories || 'mahn-ke/*' }}
          RENOVATE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'full' || '' }}
          RENOVATE_ALLOWED_COMMANDS: '["^terraform -chdir=(infrastructure|service) init -backend=false -upgrade$"]'
